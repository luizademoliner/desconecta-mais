<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconecta+</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="container" th:if="${dashboard != null}">

    <h1 class="titulo">Desconecta +</h1>

    <!-- Anel de Progresso Vetorial -->
    <div class="anel-container">
        <svg class="anel-svg" viewBox="0 0 200 200">
            <!-- Segmento Roxo (Topo Direita) -->
            <circle class="segmento seg-roxo" cx="100" cy="100" r="72"></circle>
            <!-- Segmento Verde (Baixo Direita) -->
            <circle class="segmento seg-verde" cx="100" cy="100" r="72"></circle>
            <!-- Segmento Creme (Baixo Esquerda) -->
            <circle class="segmento seg-creme" cx="100" cy="100" r="72"></circle>
            <!-- Segmento Lilás (Topo Esquerda) -->
            <circle class="segmento seg-lilas" cx="100" cy="100" r="72"></circle>
        </svg>
        <div class="anel-conteudo">
            <span class="anel-label">Tempo de foco hoje</span>
            <span class="anel-tempo"
                  th:text="${dashboard.tempoHojeSegundos / 3600} + 'h ' + ${(dashboard.tempoHojeSegundos % 3600) / 60} + 'min'">
                1h 18min
            </span>
        </div>
    </div>

    <!-- Badges -->
    <div class="badges">
        <!-- Badge 1: Pontos -->
        <div class="badge badge-roxo">
            <div class="badge-icone-box icon-roxo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 4h-2V3a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v1H5a2 2 0 0 0-2 2v2a5 5 0 0 0 4.2 4.93A6 6 0 0 0 11 17.9V20H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-2.1a6 6 0 0 0 3.8-3.97A5 5 0 0 0 21 8V6a2 2 0 0 0-2-2zM5 8V6h2v3.82A3 3 0 0 1 5 8zm14 0a3 3 0 0 1-2 1.82V6h2v2z"/>
                </svg>
            </div>
            <div class="badge-textos">
                <span class="badge-valor" th:text="${dashboard.pontosGerais}">1515</span>
                <span class="badge-label">Pontos</span>
            </div>
        </div>

        <div class="badge-divisor"></div>

        <!-- Badge 2: Média Diária da Semana -->
        <div class="badge badge-verde">
            <div class="badge-icone-box icon-verde">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 2v6l4 4-4 4v6h12v-6l-4-4 4-4V2H6zm10 14.5V18H8v-1.5l3.5-3.5c.3-.3.3-.8 0-1.1L8 8.5V6h8v2.5l-3.5 3.5c-.3.3-.3.8 0 1.1l3.5 3.4z"/>
                </svg>
            </div>
            <div class="badge-textos">
                <span class="badge-valor" th:text="${dashboard.mediaDiariaSegundosSemana / 60} + 'min'">39min</span>
                <span class="badge-label">Média</span>
            </div>
        </div>
    </div>

    <!-- Card Sequência -->
    <div class="card-sequencia">
        <div class="sequencia-icone-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2EE75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3.5z"/>
            </svg>
        </div>
        <div>
            <div class="sequencia-titulo">Sequência atual</div>
            <div class="sequencia-dias" th:text="${dashboard.diasDeSequencia} + ' dias'">7 dias</div>
        </div>
    </div>

    <div class="card-grafico">
    <div class="grafico-titulo">Foco por dia</div>

    <div class="grafico-wrapper">
        <div class="eixo-y">
            <span th:each="valor : ${dashboard.escalaEixoY}" th:text="${valor} + 'h'">4h</span>
        </div>

        <!-- Área do Gráfico e Linhas de Grade -->
        <div class="grafico-area">
            <div class="linhas-grade">
                <div class="linha"></div>
                <div class="linha"></div>
                <div class="linha"></div>
                <div class="linha"></div>
                <div class="linha"></div>
            </div>

            <div class="grafico-barras">
                <div class="barra-item" th:each="dia : ${dashboard.tempoPorDiaSemana}">
                    <div class="barra-trilho">
                        <div class="barra"
                             th:style="'height: ' + (${dia.tempoSegundos / 3600.0 / dashboard.maximoEixoY * 100 > 100 ? 100 : dia.tempoSegundos / 3600.0 / dashboard.maximoEixoY * 100}) + '%'">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="eixo-x">
        <span th:each="dia : ${dashboard.tempoPorDiaSemana}" th:text="${dia.diaAbreviado}">Seg</span>
    </div>
</div>

    <!-- Navegação Inferior -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </a>
        <a href="#" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </a>
        <a href="#" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </a>
        <a href="#" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <a href="#" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
    </nav>

</div>

<div th:if="${dashboard == null}" class="container">
    <p style="color: white; text-align: center; margin-top: 40px;">
        Não foi possível carregar seus dados. Tente fazer login novamente.
    </p>
</div>

</body>
</html>
